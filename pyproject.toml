[project]
name = "glaive"
version = "0.1.0"
description = "Agente de pentesting automatizado con reportes, optimizado en coste de tokens (un agente + herramientas + prompt caching)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[project.scripts]
glaive = "glaive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glaive"]
